<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:#fff;overflow-x:hidden}
#shapes{display:flex;height:100px}
#square{width:100px;height:100px;flex:none;background:rgb(230,0,0)}
#circle{width:100px;height:100px;flex:none;border-radius:50%;background:rgb(0,96,255)}
canvas{display:block;width:100px;height:100px}
video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
#touch{position:fixed;left:0;top:200px;display:block;width:100px;height:40px;border:0;background:rgb(0,220,220);color:#000}
#fixed{position:fixed;right:14px;bottom:150px;width:180px;height:46px;border:0;
  padding:0;border-radius:40px;background:rgb(160,32,192)}
#fixed-circle{position:fixed;left:14px;bottom:154px;width:40px;height:40px;
  border-radius:50%;background:rgb(0,144,144)}
#launch-backdrop{position:fixed;left:0;bottom:0;width:100%;height:110px;box-sizing:border-box;
  padding:11px 25px 11px 31px;display:flex;background:linear-gradient(transparent,rgba(255,255,255,.95))}
#launch-group{position:fixed;left:0;bottom:0;width:100%;height:62px;padding:0 14px;
  box-sizing:border-box;display:flex;justify-content:space-between}
.launch-item{display:flex;align-items:center;justify-content:center;width:calc((100% - 12px)/2);
  height:46px;border-radius:40px;font-size:15px;line-height:22px;color:#fff}
#group-left{background:rgb(48,80,200)}
#group-right{background:rgb(17,17,17)}
.launch-icon{display:block;width:24px;height:24px;margin-right:14px;border-radius:50%;background:#00c000}
</style></head><body>
<div id="shapes"><div id="square"></div><div id="circle"></div></div>
<canvas id="canvas" width="100" height="100"></canvas>
<video id="video" src="viewport.mp4" muted autoplay loop playsinline></video>
<button id="touch" type="button">0</button>
<button id="fixed" type="button">0</button><div id="fixed-circle"></div>
<div id="launch-backdrop"><div id="launch-group">
  <div id="group-left" class="launch-item"><i class="launch-icon"></i><span>&#25171;&#24320;&#23567;&#31243;&#24207;</span></div>
  <div id="group-right" class="launch-item"><i class="launch-icon"></i><span>&#25171;&#24320;APP</span></div>
</div></div>
<script>
const rect = e => {const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
const video=document.getElementById('video'), touch=document.getElementById('touch');
const fixed=document.getElementById('fixed');
let clicks=0, fixedClicks=0;
const ctx=document.getElementById('canvas').getContext('2d');
ctx.fillStyle='#ffb000';ctx.fillRect(0,0,100,100);ctx.fillStyle='#000';ctx.fillRect(20,20,60,60);
function report(){
  let decodedPixel=null;
  try {const c=document.createElement('canvas');c.width=c.height=1;
    const p=c.getContext('2d');p.drawImage(video,320,180,1,1,0,0,1,1);
    decodedPixel=Array.from(p.getImageData(0,0,1,1).data)} catch(e) {decodedPixel=String(e.name)}
  ViewportReport.save(JSON.stringify({dpr:devicePixelRatio,screen:{width:screen.width,height:screen.height},
    window:{width:innerWidth,height:innerHeight},
    viewport:{width:visualViewport.width,height:visualViewport.height,scale:visualViewport.scale},
    square:rect(document.getElementById('square')),circle:rect(document.getElementById('circle')),
    canvas:rect(document.getElementById('canvas')),touch:rect(touch),clicks,
    fixed:rect(fixed),fixedCircle:rect(document.getElementById('fixed-circle')),fixedClicks,
    groupLeft:rect(document.getElementById('group-left')),groupRight:rect(document.getElementById('group-right')),
    video:{...rect(video),widthPixels:video.videoWidth,heightPixels:video.videoHeight,
      time:video.currentTime,readyState:video.readyState,paused:video.paused,
      error:video.error&&video.error.code,decodedPixel}}));
}
touch.onclick=()=>{touch.textContent=String(++clicks);report()};
fixed.onclick=()=>{fixed.textContent=String(++fixedClicks);report()};
window.addEventListener('load',()=>setInterval(report,500));
video.play().catch(()=>{});
</script></body></html>
