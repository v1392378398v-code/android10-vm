name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125" "build-tools;35.0.0" "platforms;android-35"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace || echo "Build may require ROM input files. See README for details."
      continue-on-error: true
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
